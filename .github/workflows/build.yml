name: Build and validate Hero Dash local mod

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'mod/**'
      - 'tools/**'
      - 'README.md'
      - 'package.json'
  workflow_dispatch:
    inputs:
      diagnostics:
        description: 'Build the five troubleshooting APK variants'
        required: false
        type: boolean
        default: false
      build_morphe:
        description: 'Also compile the Morphe .mpp patch bundle'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Frida 17 Java bridge toolchain
        run: npm install --no-audit --no-fund
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: |
          python -m pip install --disable-pip-version-check lief==0.17.0
          if [ ! -x "$ANDROID_HOME/build-tools/34.0.0/apksigner" ]; then
            sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
            test -n "$sdkmanager_path"
            "$sdkmanager_path" --sdk_root="$ANDROID_HOME" --install 'build-tools;34.0.0'
          fi
      - name: Download pinned source APKM and Frida Gadget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input tools-cache
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/${{ github.repository }}/releases/assets/634215535' \
            -o input/herodash.apkm
          curl --fail --location --retry 3 \
            'https://github.com/frida/frida/releases/download/17.23.0/frida-gadget-17.23.0-android-arm64.so.xz' \
            -o tools-cache/arm64.so.xz
          curl --fail --location --retry 3 \
            'https://github.com/frida/frida/releases/download/17.23.0/frida-gadget-17.23.0-android-arm.so.xz' \
            -o tools-cache/arm.so.xz
          xz -d tools-cache/arm64.so.xz
          xz -d tools-cache/arm.so.xz
      - name: Check source syntax
        run: |
          python -m py_compile tools/build.py tools/extract_targets.py tools/verify.py tools/stage_morphe.py tools/verify_morphe.py
          node --check mod/mod.js
      - name: Build signed APK splits
        run: |
          python tools/build.py \
            --apkm input/herodash.apkm \
            --gadget-arm64 tools-cache/arm64.so \
            --gadget-arm tools-cache/arm.so \
            --build-tools "$ANDROID_HOME/build-tools/34.0.0" \
            --output build
      - name: Build diagnostic APK splits
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
        run: |
          for mode in none gadget java menu hooks; do
            python tools/build.py \
              --apkm input/herodash.apkm \
              --gadget-arm64 tools-cache/arm64.so \
              --gadget-arm tools-cache/arm.so \
              --build-tools "$ANDROID_HOME/build-tools/34.0.0" \
              --diagnostic "$mode" \
              --output "diagnostic-$mode"
          done
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
        with:
          name: herodash-diagnostic-no-injection
          retention-days: 1
          path: diagnostic-none/*-patched.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
        with:
          name: herodash-diagnostic-gadget-only
          retention-days: 1
          path: diagnostic-gadget/*-patched.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
        with:
          name: herodash-diagnostic-menu-only
          retention-days: 1
          path: diagnostic-menu/*-patched.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
        with:
          name: herodash-diagnostic-hooks-only
          retention-days: 1
          path: diagnostic-hooks/*-patched.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
        with:
          name: herodash-diagnostic-java-bridge
          retention-days: 1
          path: diagnostic-java/*-patched.apk
          if-no-files-found: error
      - name: Verify patch and signatures
        run: |
          python tools/verify.py --original input/herodash.apkm --output build \
            --build-tools "$ANDROID_HOME/build-tools/34.0.0"
      # Deliver the signed APK test independently of the Morphe Gradle build.
      - uses: actions/upload-artifact@v4
        with:
          name: herodash-frida17-test-apks
          retention-days: 1
          path: build/*-patched.apk
          if-no-files-found: error
      - name: Build Morphe patch bundle from public source dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_morphe }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p morphe/upstream
          git clone --depth 1 --branch v1.3.4 \
            https://github.com/MorpheApp/morphe-patches-gradle-plugin.git \
            morphe/upstream/morphe-patches-gradle-plugin
          git clone --depth 1 --branch v1.15.1 \
            https://github.com/MorpheApp/morphe-patcher.git \
            morphe/upstream/morphe-patcher
          python tools/stage_morphe.py --output build
          (cd morphe && ./gradlew buildAndroid --console=plain --no-daemon)
          cp morphe/patches/build/libs/patches-1.0.0.mpp build/herodash-local-26.5.1.12192.mpp
          python tools/verify_morphe.py --bundle build/herodash-local-26.5.1.12192.mpp --output build
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_morphe }}
        with:
          name: herodash-26.5.1.12192-local-mod
          retention-days: 1
          path: |
            build/*.mpp
            README.md
          if-no-files-found: error

# An x86_64 emulator cannot execute this game's ARM-only IL2CPP binaries.
# The previous emulator-smoke job attempted to install ARM64 APK splits there.
# Restore a runtime test only when an ARM-compatible runner/device is available.
