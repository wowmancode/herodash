name: Build and validate Hero Dash local mod

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'mod/**'
      - 'tools/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: |
          python -m pip install --disable-pip-version-check lief==0.17.0
          sdkmanager --install 'build-tools;34.0.0'
      - name: Download pinned source APKM and Frida Gadget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input tools-cache
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/${{ github.repository }}/releases/assets/634215535' \
            -o input/herodash.apkm
          curl --fail --location --retry 3 \
            'https://github.com/frida/frida/releases/download/16.7.19/frida-gadget-16.7.19-android-arm64.so.xz' \
            -o tools-cache/arm64.so.xz
          curl --fail --location --retry 3 \
            'https://github.com/frida/frida/releases/download/16.7.19/frida-gadget-16.7.19-android-arm.so.xz' \
            -o tools-cache/arm.so.xz
          xz -d tools-cache/arm64.so.xz
          xz -d tools-cache/arm.so.xz
      - name: Check source syntax
        run: |
          python -m py_compile tools/build.py tools/extract_targets.py tools/verify.py
          node --check mod/mod.js
      - name: Build signed APK splits
        run: |
          python tools/build.py \
            --apkm input/herodash.apkm \
            --gadget-arm64 tools-cache/arm64.so \
            --gadget-arm tools-cache/arm.so \
            --build-tools "$ANDROID_HOME/build-tools/34.0.0" \
            --output build
      - name: Verify patch and signatures
        run: |
          python tools/verify.py --original input/herodash.apkm --output build \
            --build-tools "$ANDROID_HOME/build-tools/34.0.0"
      - uses: actions/upload-artifact@v4
        with:
          name: herodash-26.5.1.12192-local-mod
          path: |
            build/*-patched.apk
            README.md
          if-no-files-found: error
